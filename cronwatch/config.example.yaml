# cronwatch example configuration
# Copy to config.yaml and adjust for your environment.

jobs:
  - name: daily-backup
    command: /usr/local/bin/backup.sh
    schedule: "0 2 * * *"   # 02:00 UTC every day
    timeout: 3600

  - name: hourly-sync
    command: /usr/local/bin/sync.sh
    schedule: "0 * * * *"
    timeout: 300

alerts:
  email:
    smtp_host: smtp.example.com
    smtp_port: 587
    username: alerts@example.com
    password: secret
    from_address: cronwatch@example.com
    recipients:
      - ops@example.com

throttle:
  base_interval_seconds: 300    # 5 minutes between repeated alerts
  backoff_multiplier: 2.0       # double the gap after each consecutive alert
  max_interval_seconds: 3600    # never wait more than 1 hour
  reset_on_success: true        # clear back-off when job recovers

digest:
  enabled: true
  schedule: "0 8 * * *"         # daily digest at 08:00 UTC

healthcheck:
  enabled: true
  port: 8080

history:
  path: /var/lib/cronwatch/history.json
  retention:
    max_age_days: 30
    max_entries_per_job: 500

notifier:
  min_interval_seconds: 3600
