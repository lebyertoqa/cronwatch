# cronwatch example configuration
# Copy this file to config.yaml and adjust to your needs.

alerts:
  email:
    smtp_host: localhost
    smtp_port: 25
    from_address: cronwatch@example.com
    recipients:
      - ops@example.com

jobs:
  - name: daily-backup
    command: /usr/local/bin/backup.sh
    schedule: "0 2 * * *"
    timeout_seconds: 3600
    retries: 2
    tags:
      - backup
      - nightly
    labels:
      team: ops
      env: prod
    annotations:
      runbook: https://wiki.example.com/runbooks/backup
      escalation_policy: pagerduty-critical
      notify_on_recovery: "true"
    environment:
      BACKUP_TARGET: /mnt/backups

  - name: hourly-report
    command: /usr/local/bin/report.sh
    schedule: "0 * * * *"
    timeout_seconds: 300
    tags:
      - reporting
    labels:
      team: analytics
      env: prod
    annotations:
      owner: alice
      tier: standard

  - name: db-vacuum
    command: /usr/local/bin/vacuum.sh
    schedule: "30 3 * * 0"
    timeout_seconds: 7200
    retries: 1
    enabled: false
    tags:
      - database
      - maintenance
    labels:
      team: dba
      env: prod
    annotations:
      owner: bob
      tier: critical
      runbook: https://wiki.example.com/runbooks/vacuum

retention:
  max_age_days: 90
  max_entries_per_job: 500

digest:
  enabled: true
  schedule: "0 8 * * 1"
  recipients:
    - ops@example.com

healthcheck:
  enabled: true
  port: 8080

metrics:
  enabled: true
  port: 9090
