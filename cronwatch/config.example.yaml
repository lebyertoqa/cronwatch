# cronwatch example configuration
# Copy to config.yaml and edit as needed.

jobs:
  - name: daily-backup
    command: /usr/local/bin/backup.sh
    schedule: "0 2 * * *"   # every day at 02:00 UTC
    timeout: 3600

  - name: hourly-sync
    command: /usr/local/bin/sync.sh
    schedule: "0 * * * *"
    timeout: 300

alerts:
  email:
    smtp_host: smtp.example.com
    smtp_port: 587
    username: alerts@example.com
    password: secret
    from_address: alerts@example.com
    recipients:
      - ops@example.com

# Optional: how often to send a digest of all job results (cron expression)
digest_schedule: "0 8 * * 1"   # every Monday at 08:00 UTC

# Optional: health-check HTTP server
healthcheck:
  enabled: true
  port: 8080

# Optional: notification throttling
notifier:
  min_interval_seconds: 3600   # suppress repeated alerts within 1 hour

# Optional: history retention
retention:
  max_age_days: 30      # drop entries older than 30 days
  max_entries: 200      # keep at most 200 entries per job

history_path: /var/lib/cronwatch/history.json
