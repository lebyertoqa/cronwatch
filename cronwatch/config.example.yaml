# cronwatch example configuration
# Copy to config.yaml and adjust as needed.

jobs:
  - name: daily-backup
    command: /usr/local/bin/backup.sh
    schedule: "0 2 * * *"
    timeout: 3600
    tags: [backup, nightly]
    labels:
      env: production
      team: infra
    enabled: true

  - name: hourly-sync
    command: /usr/local/bin/sync.sh
    schedule: "0 * * * *"
    timeout: 300
    tags: [sync]
    enabled: true

alerts:
  email:
    smtp_host: smtp.example.com
    smtp_port: 587
    username: alerts@example.com
    password: secret
    from_address: alerts@example.com
    recipients:
      - ops@example.com

retry:
  default_attempts: 3
  default_delay: 10.0      # seconds to wait between attempts
  default_backoff: 2.0     # multiply delay by this factor after each failure
  per_job:
    daily-backup:
      attempts: 5
      delay: 30.0
      backoff: 1.5
    hourly-sync:
      attempts: 2
      delay: 5.0

history:
  path: /var/lib/cronwatch/history.json
  retention_days: 30
  max_entries_per_job: 500

healthcheck:
  port: 8080

metrics:
  port: 9090

audit:
  path: /var/log/cronwatch/audit.log
